<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 320px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #fff;
    }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    
    .title {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .title-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #00d4aa, #3b82f6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: #1a1a1a;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
      transition: background 0.2s;
    }
    
    .status-dot.recording {
      background: #ff4444;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .status-text {
      font-size: 13px;
      color: #999;
    }
    
    .btn {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #00d4aa, #3b82f6);
      color: #fff;
    }
    
    .btn-primary:hover {
      opacity: 0.9;
    }
    
    .btn-danger {
      background: #ff4444;
      color: #fff;
    }
    
    .btn-secondary {
      background: #2a2a2a;
      color: #fff;
    }
    
    .btn-secondary:hover {
      background: #333;
    }
    
    .btn-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    
    .section {
      margin-bottom: 16px;
    }
    
    .section-title {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    
    .session-item {
      padding: 10px 12px;
      background: #1a1a1a;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .session-item:hover {
      background: #252525;
    }
    
    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    
    .session-name {
      font-size: 13px;
      font-weight: 500;
    }
    
    .session-count {
      font-size: 11px;
      color: #00d4aa;
    }
    
    .session-time {
      font-size: 11px;
      color: #666;
    }
    
    .empty {
      text-align: center;
      padding: 24px;
      color: #666;
      font-size: 13px;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    
    .stat-item {
      text-align: center;
      padding: 10px;
      background: #1a1a1a;
      border-radius: 8px;
    }
    
    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: #00d4aa;
    }
    
    .stat-label {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <div class="title-icon">A</div>
      Autopilot
    </div>
  </div>
  
  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Ready</span>
  </div>
  
  <div class="stats">
    <div class="stat-item">
      <div class="stat-value" id="sessionCount">0</div>
      <div class="stat-label">Sessions</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="todayOps">0</div>
      <div class="stat-label">Operations</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="flowCount">0</div>
      <div class="stat-label">Flows</div>
    </div>
  </div>
  
  <div class="btn-group">
    <button class="btn btn-primary" id="toggleBtn">⏹ Stop Recording</button>
    <button class="btn btn-secondary" id="newBtn">New</button>
  </div>
  
  <div class="section">
    <div class="section-title">Recent Sessions</div>
    <div id="sessionsList"></div>
  </div>
  
  <div class="btn-group">
    <button class="btn btn-secondary" id="dashboardBtn">📊 Open Dashboard</button>
    <button class="btn btn-danger" id="clearBtn">Clear All</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
